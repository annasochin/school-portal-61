# /etc/nginx/sites-available/school-portal
# После копирования: ln -s /etc/nginx/sites-available/school-portal /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name school61.example.ru;  # домен школы

    client_max_body_size 40m;  # лимит на загружаемые файлы

    location /static/ {
        alias /srv/school-portal/app/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
