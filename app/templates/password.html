{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Смена пароля</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/password">
    <label>Текущий пароль
      <input type="password" name="current" required autocomplete="current-password">
    </label>
    <label>Новый пароль (минимум 6 символов)
      <input type="password" name="new" required minlength="6" autocomplete="new-password">
    </label>
    <label>Повторите новый пароль
      <input type="password" name="new2" required minlength="6" autocomplete="new-password">
    </label>
    <button class="btn btn-primary" type="submit">Сменить пароль</button>
    <a class="btn btn-ghost" href="/cabinet">Отмена</a>
  </form>
</div>
{% endblock %}
