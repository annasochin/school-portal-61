{% extends "base.html" %}
{% block title %}Вход — Школьный портал{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Вход для учителей</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>Логин <input name="login_name" required autofocus></label>
    <label>Пароль <input type="password" name="password" required></label>
    <button class="btn btn-primary" type="submit">Войти</button>
  </form>
  <p class="hint">Нет аккаунта? <a href="/register">Зарегистрируйтесь</a>. Ученикам регистрация не нужна — просто ищите информацию на главной.</p>
</div>
{% endblock %}
