{% extends "base.html" %}
{% block title %}Регистрация учителя — Школьный портал{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Регистрация учителя</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <label>Фамилия и имя <input name="full_name" required placeholder="Иванова Мария Петровна"></label>
    <label>Предмет преподавания
      <select name="subject">
        {% for s in SUBJECTS %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
      </select>
    </label>
    <label>Логин <input name="login_name" required minlength="3"></label>
    <label>Пароль <input type="password" name="password" required minlength="6"></label>
    <label>Повторите пароль <input type="password" name="password2" required minlength="6"></label>
    <button class="btn btn-primary" type="submit">Создать аккаунт</button>
  </form>
  <p class="hint">Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
{% endblock %}
